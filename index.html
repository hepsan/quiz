
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIG - Frågespel</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .game-container { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 450px; 
            padding: 40px 30px; 
            text-align: center; 
        }
        .category-badge { 
            display: inline-block; 
            padding: 8px 16px; 
            border-radius: 20px; 
            color: white; 
            font-weight: bold; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            font-size: 0.9em; 
            letter-spacing: 1px; 
            transition: background-color 0.3s;
        }
        .question-box { 
            min-height: 120px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 20px; 
        }
        .question { 
            font-size: 1.3em; 
            font-weight: 600; 
            color: #2c3e50; 
            line-height: 1.4;
        }
        .answer-box { 
            min-height: 60px; 
            margin-bottom: 30px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .answer { 
            font-size: 1.2em; 
            color: #27ae60; 
            font-weight: bold; 
            display: none; 
            animation: fadeIn 0.3s ease-in;
        }
        button { 
            border: none; 
            padding: 14px 24px; 
            border-radius: 8px; 
            font-size: 1.1em; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.1s, background-color 0.2s; 
            width: 100%; 
            margin-bottom: 15px; 
        }
        button:active { 
            transform: scale(0.98); 
        }
        .btn-reveal { 
            background-color: #3498db; 
            color: white; 
        }
        .btn-reveal:hover { 
            background-color: #2980b9; 
        }
        .btn-next { 
            background-color: #e74c3c; 
            color: white; 
        }
        .btn-next:hover { 
            background-color: #c0392b; 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="category" class="category-badge" style="background-color: #95a5a6;">Välkommen!</div>
    <div class="question-box">
        <div id="question" class="question">Klicka på knappen nedan för att dra din första fråga.</div>
    </div>
    <div class="answer-box">
        <div id="answer" class="answer"></div>
    </div>
    <button id="btn-reveal" class="btn-reveal" onclick="revealAnswer()" style="display: none;">Visa svar</button>
    <button id="btn-next" class="btn-next" onclick="nextQuestion()">Dra en fråga</button>
</div>

<script>
    // Här kan du fylla på med hundratals fler frågor. Kopiera bara formatet nedan!
    const questionsData = [
        // Kategori: Film & TV
        { cat: "Film & TV", color: "#9b59b6", q: "Vilken svensk skådespelare spelar Pennywise i filmen 'It'?", a: "Bill Skarsgård" },
        { cat: "Film & TV", color: "#9b59b6", q: "Vad heter kaffebaren där vännerna i serien 'Vänner' ofta hänger?", a: "Central Perk" },
        { cat: "Film & TV", color: "#9b59b6", q: "Vilken filmserie utspelar sig 'i en galax långt, långt borta'?", a: "Star Wars" },
        { cat: "Film & TV", color: "#9b59b6", q: "Vem regisserade kultfilmen Pulp Fiction från 1994?", a: "Quentin Tarantino" },
        { cat: "Film & TV", color: "#9b59b6", q: "Vilken färg har pillret som Neo sväljer i The Matrix för att vakna upp?", a: "Rött" },
        
        // Kategori: Internetkultur
        { cat: "Internetkultur", color: "#34495e", q: "Vad kallas den virala memen med en hund av rasen Shiba Inu som ofta pratar i färgglad text?", a: "Doge" },
        { cat: "Internetkultur", color: "#34495e", q: "Vilken svensk youtuber var under många år den med flest prenumeranter i hela världen?", a: "PewDiePie" },
        { cat: "Internetkultur", color: "#34495e", q: "Vad står den vanliga internetförkortningen 'TL;DR' för?", a: "Too Long; Didn't Read" },
        { cat: "Internetkultur", color: "#34495e", q: "Vilket årtal lanserades plattformen YouTube?", a: "2005" },
        { cat: "Internetkultur", color: "#34495e", q: "Vad heter spelet där man bygger landskap med block och måste akta sig för Creepers?", a: "Minecraft" },
        
        // Kategori: Historia
        { cat: "Historia", color: "#f1c40f", q: "Vilket år bröt den franska revolutionen ut?", a: "1789" },
        { cat: "Historia", color: "#f1c40f", q: "Vilken svensk kung kallas ofta för 'Lejonet från Norden'?", a: "Gustav II Adolf" },
        { cat: "Historia", color: "#f1c40f", q: "Vad hette det enorma passagerarfartyget som sjönk på sin jungfrufärd 1912?", a: "Titanic" },
        { cat: "Historia", color: "#f1c40f", q: "Vilken historisk tidsperiod kom direkt efter medeltiden?", a: "Renässansen" },
        { cat: "Historia", color: "#f1c40f", q: "Vem var den allra första människan i rymden?", a: "Jurij Gagarin" },
        
        // Kategori: Kultur
        { cat: "Kultur", color: "#e67e22", q: "Vem har skrivit böckerna om Pippi Långstrump?", a: "Astrid Lindgren" },
        { cat: "Kultur", color: "#e67e22", q: "Vilken berömd konstnär målade 'Mona Lisa'?", a: "Leonardo da Vinci" },
        { cat: "Kultur", color: "#e67e22", q: "Vad kallas den japanska konsten att vika papper till olika figurer?", a: "Origami" },
        { cat: "Kultur", color: "#e67e22", q: "Vilken grön, stark chilifrukt förknippas ofta med det mexikanska köket?", a: "Jappa Leno" },
        { cat: "Kultur", color: "#e67e22", q: "Vilken storstad är känd för sitt operahus med vita takvalv som liknar snäckskal?", a: "Sydney" },
        
        // Kategori: Djur & Natur
        { cat: "Djur & Natur", color: "#27ae60", q: "Vilket är världens största nu levande landdjur?", a: "Afrikansk elefant" },
        { cat: "Djur & Natur", color: "#27ae60", q: "Vilken fågel är känd för att inte kunna flyga, men simmar utmärkt och lever främst på södra halvklotet?", a: "Pingvin" },
        { cat: "Djur & Natur", color: "#27ae60", q: "Vad är det vetenskapliga namnet för oss människor?", a: "Homo sapiens" },
        { cat: "Djur & Natur", color: "#27ae60", q: "Hur många ben har en fullvuxen spindel?", a: "Åtta" },
        { cat: "Djur & Natur", color: "#27ae60", q: "Vilket av dessa trädslag släpper sina löv/barr på hösten: gran, björk eller tall?", a: "Björk" },
        
        // Kategori: Sport
        { cat: "Sport", color: "#2980b9", q: "Vilket land vann herrarnas fotbolls-VM i Qatar 2022?", a: "Argentina" },
        { cat: "Sport", color: "#2980b9", q: "Hur många spelare får ett lag ha på isen samtidigt under en ishockeymatch (inklusive målvakt)?", a: "6" },
        { cat: "Sport", color: "#2980b9", q: "Inom vilken sport används termen 'Hole in one'?", a: "Golf" },
        { cat: "Sport", color: "#2980b9", q: "Vilken europeisk stad arrangerade sommar-OS 2012?", a: "London" },
        { cat: "Sport", color: "#2980b9", q: "I vilken sport tävlar man i mästerskapsmatchen 'Super Bowl'?", a: "Amerikansk fotboll" }
    ];

    let currentQuestion = null;

    function nextQuestion() {
        // Välj en slumpmässig fråga från arrayen
        const randomIndex = Math.floor(Math.random() * questionsData.length);
        currentQuestion = questionsData[randomIndex];

        // Uppdatera gränssnittet
        const catElement = document.getElementById("category");
        catElement.innerText = currentQuestion.cat;
        catElement.style.backgroundColor = currentQuestion.color;

        document.getElementById("question").innerText = currentQuestion.q;
        
        // Dölj svaret inför nästa fråga
        const answerElement = document.getElementById("answer");
        answerElement.innerText = currentQuestion.a;
        answerElement.style.display = "none";

        // Byt knappar
        document.getElementById("btn-reveal").style.display = "block";
        document.getElementById("btn-next").style.display = "none";
    }

    function revealAnswer() {
        if(currentQuestion) {
            document.getElementById("answer").style.display = "block";
            document.getElementById("btn-reveal").style.display = "none";
            
            // Uppdatera knappen för nästa fråga och visa den
            const nextBtn = document.getElementById("btn-next");
            nextBtn.innerText = "Dra en ny fråga";
            nextBtn.style.display = "block";
        }
    }
</script>

</body>
</html>
